!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title> six seven </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="card-home">
            <h2> Academia do six seven</h2>
            <p id="menssagemBoasVindas">Bem vindo</p>
            <p> Treino liberado.</p>
            <button id=" btnSair">Sair</button>
        </div>

        <script>
            const usuarioLogado = localStorage.getItem('usuarioLogado');

            if(!usuarioLogado){
                window.location.href="index.html";

            }else{

            document.getElementById('menssagemBoasvindas').textContent = 'Bem vindo', +usuariologado +'!';
            }
            document.getElementById('btnSair').addEventListener('click',function(){
                localStorage.removeItem('usuarioLogado');
                window.location.href='index.html';
            });
        </script>
    </body>
</html>
